[package]
name = "rinova-void"
version = "0.3.4"
description = "Void — Your pocket from the void. A desktop toolbox."
authors = ["Rina <jiuzhang.song+rina@gmail.com>"]
license = "MIT"
repository = "https://github.com/jove-rina/rinova-void"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
libc = "0.2"
tauri = { version = "2.11.3", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
rinova-proxy-sdk = "1.0.0"
tokio = { version = "1", features = ["time"] }
arboard = "3.6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "ico",
  "avif",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
display-info = "0.4"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow"] }
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
