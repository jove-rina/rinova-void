[[permission]]
identifier = "allow-image-editor"
description = "Image editor IPC commands"
commands.allow = [
  "export_binary_file",
  "export_binary_file_base64",
  "export_binary_base64_to_path",
  "convert_image_base64_to_path",
  "export_rgba_image",
  "convert_image_base64",
  "begin_export_buffer",
  "append_export_base64",
  "cancel_export_buffer",
  "finish_export_binary",
  "finish_convert_export",
  "reveal_export_path",
  "read_image_file",
  "begin_editor_session",
  "append_editor_session_image",
  "commit_editor_session",
  "take_image_editor_session",
  "save_image_editor_project",
  "list_image_editor_projects",
  "load_image_editor_project",
  "delete_image_editor_project",
  "open_image_editor_window",
]
